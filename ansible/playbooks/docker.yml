---
- name: Install Docker
  hosts: app:monitoring
  become: true

  tasks:
    - name: Install Docker and Compose
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
          - python3-docker
        state: present
        update_cache: true

    - name: Start Docker on boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Let ubuntu run docker without sudo
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
