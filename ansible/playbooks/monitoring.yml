---
- name: Deploy Prometheus and Grafana
  hosts: monitoring
  become: true

  tasks:
    - name: Create monitoring folder
      ansible.builtin.file:
        path: /opt/monitoring
        state: directory
        mode: "0755"

    - name: Generate Prometheus config from inventory
      ansible.builtin.template:
        src: prometheus.yml.j2
        dest: /opt/monitoring/prometheus.yml
        mode: "0644"
      notify: Restart Prometheus

    - name: Copy Compose file and Grafana datasource
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../monitoring/{{ item }}"
        dest: /opt/monitoring/{{ item }}
        mode: "0644"
      loop:
        - docker-compose.yml
        - grafana-datasource.yml

    - name: Start Prometheus and Grafana
      community.docker.docker_compose_v2:
        project_src: /opt/monitoring

  handlers:
    - name: Restart Prometheus
      community.docker.docker_compose_v2:
        project_src: /opt/monitoring
        services:
          - prometheus
        state: restarted
