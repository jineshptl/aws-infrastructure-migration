- name: Set up control plane
  hosts: control
  become: true
  tasks:
    - name: Run kubeadm init
      ansible.builtin.command: kubeadm init --skip-phases=addon/kube-proxy
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Kubeconfig for ubuntu
      ansible.builtin.shell: |
        mkdir -p /home/ubuntu/.kube
        cp /etc/kubernetes/admin.conf /home/ubuntu/.kube/config
        chown -R ubuntu:ubuntu /home/ubuntu/.kube
      args:
        creates: /home/ubuntu/.kube/config

    - name: Install cilium CLI
      ansible.builtin.unarchive:
        src: https://github.com/cilium/cilium-cli/releases/latest/download/cilium-linux-arm64.tar.gz
        dest: /usr/local/bin
        remote_src: true
        creates: /usr/local/bin/cilium

    - name: Check if Cilium is installed
      ansible.builtin.command: kubectl -n kube-system get ds cilium
      become: false
      register: cilium_ds
      failed_when: false
      changed_when: false

    - name: Install Cilium
      ansible.builtin.command: >
        cilium install
        --set kubeProxyReplacement=true
        --set k8sServiceHost={{ ansible_default_ipv4.address }}
        --set k8sServicePort=6443
        --set bgpControlPlane.enabled=true
      become: false
      when: cilium_ds.rc != 0
      changed_when: true

    - name: Get join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join
      changed_when: false

- name: Join workers
  hosts: worker
  become: true
  tasks:
    - name: Run kubeadm join
      ansible.builtin.command: "{{ hostvars[groups['control'][0]].join.stdout }}"
      args:
        creates: /etc/kubernetes/kubelet.conf

- name: Check Cilium
  hosts: control
  become: false
  tasks:
    - name: Wait for Cilium
      ansible.builtin.command: cilium status --wait
      changed_when: false
